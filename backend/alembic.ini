# Alembic configuration. Run commands from backend/ with the venv active:
#   alembic upgrade head                   apply all migrations to the development database
#   alembic -x target=test upgrade head    ... to the Neon "test" branch
#   alembic downgrade -1                   undo the latest migration
#   alembic revision --autogenerate -m "describe the change"
#
# The database URL is deliberately NOT in this file: it contains a password. alembic/env.py
# reads it from backend/.env (DATABASE_MIGRATION_URL, Neon's direct endpoint).

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# Split path lists with the OS separator (";" on Windows), not on colons that appear in "C:\".
path_separator = os
# Migration files sort by date: 20261109_1a2b3c4d5e6f_create_tables.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40

[post_write_hooks]
# Format every newly generated migration with ruff, like the rest of the code.
hooks = ruff
ruff.type = module
ruff.module = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
