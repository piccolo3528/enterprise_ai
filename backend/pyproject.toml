[project]
name = "enterprise-knowledge-intelligence"
version = "0.1.0"
description = "RAG platform: knowledge bases, document ingestion, hybrid retrieval and grounded answers with citations."
requires-python = ">=3.12,<3.13"

# torch is installed separately from the CPU-only index (see README step 3),
# so pip doesn't pull the multi-GB CUDA build. sentence-transformers then reuses it.
dependencies = [
    # web framework + ASGI server (uvicorn[standard] adds watchfiles for --reload)
    "fastapi>=0.162,<0.163",
    "uvicorn[standard]>=0.54,<0.55",
    # configuration
    "pydantic-settings>=2.16,<3",
    "email-validator>=2.3,<3",  # pydantic's EmailStr
    # authentication: password hashing + signed session tokens
    "argon2-cffi>=25.1,<26",
    "pyjwt>=2.15,<3",
    "python-dotenv>=1.0",
    # Markdown front matter (S2); always yaml.safe_load, never yaml.load
    "pyyaml>=6.0",
    # document uploads (M7): multipart parsing, PDF, DOCX, text-encoding detection.
    # PyMuPDF is pinned below 2: 2.x pulls in onnxruntime + layout-analysis extras we don't use.
    # PyMuPDF is AGPL (tracker L20); pypdf (BSD) is the drop-in alternative.
    "python-multipart>=0.0.33",
    "pymupdf>=1.28,<2",
    "python-docx>=1.2,<2",
    "charset-normalizer>=3.5,<4",
    # chunking (M8): counting tokens with the embedding model's own tokenizer.json (no PyTorch)
    "tokenizers>=0.23,<0.24",
    "huggingface-hub>=2.4,<3",
    # PostgreSQL (Neon)
    "sqlalchemy>=2.1,<2.2",
    "psycopg[binary]>=3.3,<3.4",
    "alembic>=1.20,<1.21",  # versioned schema migrations
    "certifi",  # CA bundle for sslmode=verify-full on Windows
    # vector database: client minor version must match the Qdrant server (1.20)
    "qdrant-client>=1.20,<1.21",
    # LLM
    "google-genai>=2.34,<3",
    # local embeddings + cross-encoder reranking
    "sentence-transformers>=6.2,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.28",  # FastAPI's TestClient is built on httpx
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# backend/alembic/ (our migrations folder) is not the alembic library.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can `from tests.helpers import ...`
# Tests marked "live" talk to the real Neon/Qdrant from backend/.env: run them with `pytest -m live`.
addopts = "-m 'not live'"
markers = ["live: needs network access and the real services configured in backend/.env"]
